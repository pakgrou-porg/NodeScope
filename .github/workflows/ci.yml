name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  contracts:
    name: API and telemetry contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.32.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm proto:generate
      - run: pnpm api:generate
      - run: git diff --exit-code -- telemetry/v1/envelope.pb.go api/openapi/generated.ts

  go:
    name: Go core (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: go test ./...
      - run: GOOS=linux GOARCH=${{ matrix.goarch }} go build ./...

  windows-agent:
    name: Windows agent cross-build (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: GOOS=windows GOARCH=${{ matrix.goarch }} go build ./cmd/nodescope-agent
      - run: GOOS=windows GOARCH=${{ matrix.goarch }} go test -c -o /tmp/nodescope-agent-windows-${{ matrix.goarch }}.test.exe ./internal/agent

  windows-agent-runtime:
    name: Windows agent runtime tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: go test ./internal/agent

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
