syntax = "proto3";

package nodescope.telemetry.v1;

option go_package = "github.com/pakgrou-porg/nodescope/telemetry/v1;telemetryv1";

// Envelope is a bounded, idempotent unit of telemetry submitted by one agent.
// The server validates the declared sizes and checksum before decoding samples.
message Envelope {
  uint32 schema_version = 1;
  string codec = 2;
  string agent_id = 3;
  string host_id = 4;
  string boot_id = 5;
  uint64 sequence = 6;
  int64 observed_unix_nano = 7;
  uint64 monotonic_elapsed_nano = 8;
  uint32 sample_count = 9;
  uint32 metric_value_count = 10;
  uint32 uncompressed_bytes = 11;
  uint32 compressed_bytes = 12;
  bytes checksum_sha256 = 13;
  repeated MetricSample samples = 14;
  repeated ContainerInventory containers = 15;
}

message MetricSample {
  string device_id = 1;
  string metric_name = 2;
  string unit = 3;
  MetricQuality quality = 4;
  string source = 5;
  string semantics = 6;
  int64 observed_unix_nano = 7;
  oneof scalar_value {
    double number_value = 8;
    bool boolean_value = 9;
    string text_value = 10;
  }
}

message ContainerInventory {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string health = 5;
  bool selected_for_alerting = 6;
}

enum MetricQuality {
  METRIC_QUALITY_UNSPECIFIED = 0;
  METRIC_QUALITY_FRESH = 1;
  METRIC_QUALITY_STALE = 2;
  METRIC_QUALITY_UNAVAILABLE = 3;
  METRIC_QUALITY_UNSUPPORTED = 4;
  METRIC_QUALITY_ESTIMATED = 5;
}
