name: nodescope-framework

# Deploy this stack through Portainer's Git repository stack mode so the
# relative build context resolves to the reviewed NodeScope source tree.
# Do not paste runtime secrets or private keys into this file or Portainer
# environment variables; use the protected host runtime.env file instead.
services:
  nodescope-server:
    image: ${NODESCOPE_IMAGE_REF:-nodescope-framework:edge}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    container_name: nodescope-framework-server
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "${NODESCOPE_BIND_ADDRESS:-10.116.2.145}:${NODESCOPE_TLS_PORT:-8443}:8080"
    env_file:
      - ${NODESCOPE_FRAMEWORK_RUNTIME_SECRETS_FILE:-/srv/nodescope/runtime/runtime.env}
    environment:
      NODESCOPE_LISTEN_ADDRESS: ":8080"
      NODESCOPE_REPLICA_ID: ${NODESCOPE_REPLICA_ID:-framework}
      NODESCOPE_REPLICA_ROLE: ${NODESCOPE_REPLICA_ROLE:-preferred}
      NODESCOPE_PRIMARY_ENDPOINT: ${NODESCOPE_PRIMARY_ENDPOINT:-https://10.116.2.145:8443}
      NODESCOPE_SECONDARY_ENDPOINT: ${NODESCOPE_SECONDARY_ENDPOINT:-https://10.116.2.56:8443}
      NODESCOPE_SUPABASE_URL: ${NODESCOPE_SUPABASE_URL:?set in Portainer stack environment}
      NODESCOPE_RUNTIME_DB_HOST: ${NODESCOPE_RUNTIME_DB_HOST:?set in Portainer stack environment}
      NODESCOPE_RUNTIME_DB_PORT: ${NODESCOPE_RUNTIME_DB_PORT:-5432}
      NODESCOPE_RUNTIME_DB_NAME: ${NODESCOPE_RUNTIME_DB_NAME:-postgres}
      NODESCOPE_RUNTIME_DB_USER: ${NODESCOPE_RUNTIME_DB_USER:-nodescope_runtime_login}
      NODESCOPE_TLS_CERT_PATH: /run/nodescope/certs/server.crt
      NODESCOPE_TLS_KEY_PATH: /run/nodescope/certs/server.key
    volumes:
      - type: bind
        source: ${NODESCOPE_FRAMEWORK_CERT_DIRECTORY:-/srv/nodescope/certs}
        target: /run/nodescope/certs
        read_only: true
      - type: bind
        source: ${NODESCOPE_FRAMEWORK_RUNTIME_DIRECTORY:-/srv/nodescope/runtime}
        target: /run/nodescope/runtime
        read_only: true
    healthcheck:
      test: ["CMD", "/app/nodescope-probe", "https://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
